<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIS Lead CRM</title>
  <style>
    :root{--bg:#f4f6f4;--panel:#fff;--ink:#17211c;--muted:#647169;--line:#dbe2dd;--green:#1f6f4a;--blue:#315f86;--red:#a33a33;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:#17211c;color:#fff;padding:24px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:48px;height:48px;background:#274133;font-weight:900}.eyebrow{margin:0 0 4px;color:#759481;text-transform:uppercase;font-size:.74rem;font-weight:800}.side .eyebrow{color:#b8cdbf}h1,h2,h3,h4,p{margin-top:0}h1{font-size:1.35rem;margin-bottom:0}h2{font-size:clamp(1.35rem,2vw,2rem);margin-bottom:0}.nav{display:grid;gap:8px}.nav button{border:0;border-radius:8px;background:transparent;color:#dfe9e2;text-align:left;padding:12px 14px}.nav button.active,.nav button:hover{background:#274133;color:#fff}.note{margin-top:auto;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:14px;color:#dfe9e2;line-height:1.45}.main{padding:28px;display:grid;gap:18px;align-content:start}.top,.panel-head,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px}.btn{border:0;border-radius:8px;background:var(--green);color:#fff;padding:10px 14px;font-weight:800;min-height:42px}.btn.secondary{background:#e3ebe6;color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px}.metric,.panel,.col,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}.metric{padding:14px}.metric span,.metric small{color:var(--muted)}.metric strong{display:block;font-size:1.35rem;margin:6px 0}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start}.panel{padding:18px}.form{display:grid;gap:11px;margin-top:16px}label{display:grid;gap:6px;color:#34433a;font-size:.86rem;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:42px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(130px,1fr));gap:10px;margin-bottom:16px}.view{display:none}.view.active{display:block}.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto}.col{background:#eef2ef;min-width:210px}.col-head{padding:12px;border-bottom:1px solid var(--line)}.col-head h3{font-size:.92rem;margin-bottom:4px}.col-head p{margin:0;color:var(--muted);font-size:.82rem}.cards{padding:10px;display:grid;gap:10px}.card{padding:12px;display:grid;gap:9px}.card-top{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-weight:800}.card h4{margin:0;font-size:.98rem}.card p{margin:0;color:var(--muted);font-size:.88rem}.card dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}.card dt{color:var(--muted);font-size:.72rem;font-weight:800}.card dd{margin:0;font-weight:800}.text{border:0;background:transparent;color:var(--blue);font-weight:800;padding:0}.danger{color:var(--red)}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f7faf8;color:#435248;font-size:.78rem;text-transform:uppercase}.table-wrap{overflow-x:auto}.empty{color:var(--muted);margin:0;font-size:.9rem}@media(max-width:1100px){.shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.note{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:720px){.main,.side{padding:18px}.top,.panel-head,.toolbar{align-items:stretch;flex-direction:column}.metrics,.filters,.row{grid-template-columns:1fr}.btn{width:100%}}@media print{.side,.top,.metrics,.panel:first-child,.filters,#board,#list{display:none!important}.shell,.layout{display:block}.main,.panel{padding:0;border:0}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark">CIS</div><div><p class="eyebrow">Sales CRM</p><h1>Lead Pipeline</h1></div></div>
    <nav class="nav"><button class="active" data-view="board">Pipeline</button><button data-view="list">Lead List</button><button data-view="report">Leadership Report</button></nav>
    <div class="note"><strong>Manual-aligned stages</strong><br>Lead intake, measure, quote, sale, install, and close-out stay visible without bloating the board.</div>
  </aside>
  <main class="main">
    <header class="top"><div><p class="eyebrow">Inbound lead tracking</p><h2>Quote activity, won/lost outcomes, and revenue by rep</h2></div><div><button class="btn secondary" id="reset">Reset Sample</button> <button class="btn" id="export-report">Export Report CSV</button></div></header>
    <section class="metrics" id="metrics"></section>
    <section class="layout">
      <section class="panel">
        <div class="panel-head"><div><p class="eyebrow">Lead entry</p><h3>Add or update lead</h3></div><button class="btn secondary" id="clear">Clear</button></div>
        <form class="form" id="form">
          <input type="hidden" name="id"><label>Lead ID<input name="externalLeadId" required placeholder="HDSC or PO number"></label><label>Customer<input name="customerName" required placeholder="Customer or company"></label><label>Assigned Rep<select name="repName" required><option>Tyler</option><option>Mary</option><option>Sergio</option><option>Jordan</option></select></label>
          <div class="row"><label>Source<select name="source"><option>HDSC</option><option>Home Depot Store</option><option>Phone</option><option>Email</option><option>Referral</option></select></label><label>Path<select name="jobPath"><option>SFI</option><option>F&I</option></select></label></div>
          <label>Job location<input name="address" placeholder="Street, city, state"></label><div class="row"><label>Store #<input name="storeNumber"></label><label>Product<input name="productType"></label></div><label>Stage<select name="stageId" id="stage-input"></select></label>
          <div class="row"><label>Received<input name="dateReceived" type="date" required></label><label>Measure Done<input name="measureCompletedDate" type="date"></label></div><div class="row"><label>Quote Amount<input name="quoteAmount" type="number" min="0" step="0.01"></label><label>Quote Sent<input name="quoteSentDate" type="date"></label></div><div class="row"><label>Won Date<input name="soldDate" type="date"></label><label>Closed Date<input name="closedDate" type="date"></label></div><div class="row"><label>Final Revenue<input name="realizedRevenue" type="number" min="0" step="0.01"></label><label>Lost Reason<select name="lostReason"><option value="">None</option><option>No Contact Made</option><option>No Longer Interested</option><option>Out of Scope</option><option>Price</option><option>Cancelled</option><option>Duplicate</option></select></label></div><label>Notes<textarea name="notes" rows="4"></textarea></label><button class="btn" type="submit">Save Lead</button>
        </form>
      </section>
      <section class="panel">
        <div class="filters"><label>Search<input id="q" placeholder="Customer, lead ID, store, address"></label><label>Rep<select id="rep-filter"></select></label><label>Stage<select id="stage-filter"></select></label><label>Received from<input id="start" type="date"></label></div>
        <div class="view active" id="board"></div><div class="view" id="list"></div><div class="view" id="report"></div>
      </section>
    </section>
  </main>
</div>
<script>
const stages=[['intake_measure_prep','Intake & Measure Prep','Intake','pre_quote'],['measure_management','Measure Management','Measure','pre_quote'],['quote_customer_decision','Quote & Customer Decision','Quote','open_potential'],['sold_payment_gate','Sold / Payment Gate','Sold','won'],['install_closeout','Install & Close-Out','Close-Out','realized'],['lost_cancelled','Lost / Cancelled','Lost','lost']].map((s,i)=>({id:s[0],name:s[1],short:s[2],state:s[3],sort:(i+1)*10}));
const stageById=Object.fromEntries(stages.map(s=>[s.id,s]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n||0));const num=n=>new Intl.NumberFormat('en-US').format(Number(n||0));const pct=n=>Math.round(Number(n||0)*100)+'%';const today=()=>new Date().toISOString().slice(0,10);const key='cis-lead-crm-v1';
const sample=[{id:'1',externalLeadId:'F10482901',customerName:'Northview Charter School',repName:'Tyler',source:'HDSC',jobPath:'SFI',address:'Fort Worth, TX',storeNumber:'6512',productType:'Carpet tile',stageId:'quote_customer_decision',dateReceived:'2026-07-20',measureCompletedDate:'2026-07-23',quoteAmount:18450,quoteSentDate:'2026-07-25',notes:'Board review expected this week.'},{id:'2',externalLeadId:'F10483277',customerName:'Mesa Retail Group',repName:'Mary',source:'HDSC',jobPath:'F&I',address:'Plano, TX',storeNumber:'5401',productType:'LVP',stageId:'sold_payment_gate',dateReceived:'2026-07-18',measureCompletedDate:'2026-07-22',quoteAmount:32600,quoteSentDate:'2026-07-24',soldDate:'2026-07-29',notes:'Agreement signed. Payment link sent.'},{id:'3',externalLeadId:'F10484109',customerName:'Grace Fellowship Hall',repName:'Sergio',source:'Home Depot Store',jobPath:'SFI',address:'Denton, TX',storeNumber:'5890',productType:'Sheet vinyl',stageId:'measure_management',dateReceived:'2026-07-28',quoteAmount:0,notes:'HDMS measure requested.'},{id:'4',externalLeadId:'F10485522',customerName:'Riverside Office Suites',repName:'Tyler',source:'HDSC',jobPath:'SFI',address:'Arlington, TX',storeNumber:'5286',productType:'Broadloom',stageId:'install_closeout',dateReceived:'2026-07-05',measureCompletedDate:'2026-07-09',quoteAmount:42125,quoteSentDate:'2026-07-11',soldDate:'2026-07-16',closedDate:'2026-08-01',realizedRevenue:42125,notes:'Customer approval filed. No balance remains.'},{id:'5',externalLeadId:'F10486218',customerName:'Harbor Childcare Center',repName:'Mary',source:'Referral',jobPath:'SFI',address:'Dallas, TX',storeNumber:'0562',productType:'Rubber flooring',stageId:'lost_cancelled',dateReceived:'2026-07-10',measureCompletedDate:'2026-07-14',quoteAmount:21900,quoteSentDate:'2026-07-16',lostReason:'Price',notes:'Customer selected a lower bid.'}];
let leads=JSON.parse(localStorage.getItem(key)||'null')||sample;let view='board';function save(){localStorage.setItem(key,JSON.stringify(leads))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function filtered(){let q=document.querySelector('#q').value.toLowerCase(),r=document.querySelector('#rep-filter').value,s=document.querySelector('#stage-filter').value,start=document.querySelector('#start').value;return leads.filter(l=>(!q||Object.values(l).join(' ').toLowerCase().includes(q))&&(r==='all'||l.repName===r)&&(s==='all'||l.stageId===s)&&(!start||l.dateReceived>=start))}
function roll(rows){let map=new Map();for(const l of rows){let m=map.get(l.repName)||{rep:l.repName,leads:0,run:0,quotes:0,quoted:0,potential:0,wonJobs:0,lostJobs:0,won:0,realized:0,closed:0};let st=stageById[l.stageId];let q=Number(l.quoteAmount||0),real=Number(l.realizedRevenue||0)||q;m.leads++;if(l.measureCompletedDate)m.run++;if(l.quoteSentDate){m.quotes++;m.quoted+=q}if(st.state==='open_potential')m.potential+=q;if(st.state==='won'||st.state==='realized'){m.wonJobs++;m.won+=q}if(st.state==='realized'||l.closedDate){m.closed++;m.realized+=real}if(st.state==='lost')m.lostJobs++;map.set(l.repName,m)}return [...map.values()].map(m=>({...m,winRate:(m.wonJobs+m.lostJobs)?m.wonJobs/(m.wonJobs+m.lostJobs):0})).sort((a,b)=>b.realized-a.realized||b.won-a.won||a.rep.localeCompare(b.rep))}
function totals(rows){return roll(rows).reduce((a,m)=>{for(const k of ['leads','run','quotes','quoted','potential','wonJobs','lostJobs','won','realized','closed'])a[k]+=m[k];return a},{leads:0,run:0,quotes:0,quoted:0,potential:0,wonJobs:0,lostJobs:0,won:0,realized:0,closed:0})}
function render(){let rows=filtered(),t=totals(rows);document.querySelector('#metrics').innerHTML=[['Leads',num(t.leads),'assigned'],['Quotes Sent',num(t.quotes),money(t.quoted)+' quoted'],['Open Potential',money(t.potential),'quoted, not decided'],['Won Revenue',money(t.won),pct((t.wonJobs+t.lostJobs)?t.wonJobs/(t.wonJobs+t.lostJobs):0)+' win rate'],['Realized Revenue',money(t.realized),'closed-out value']].map(x=>`<article class=metric><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></article>`).join('');renderFilters();renderBoard(rows);renderList(rows);renderReport(rows);document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===view));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function renderFilters(){let rep=document.querySelector('#rep-filter'),cur=rep.value||'all',reps=[...new Set(leads.map(l=>l.repName))].sort();rep.innerHTML='<option value=all>All reps</option>'+reps.map(r=>`<option ${r===cur?'selected':''}>${esc(r)}</option>`).join('');let sf=document.querySelector('#stage-filter'),sc=sf.value||'all';sf.innerHTML='<option value=all>All stages</option>'+stages.map(s=>`<option value=${s.id} ${s.id===sc?'selected':''}>${s.name}</option>`).join('')}
function card(l){return `<article class=card><div class=card-top><span>${esc(l.externalLeadId)}</span><span>${esc(l.repName)}</span></div><h4>${esc(l.customerName)}</h4><p>${esc(l.productType||'Product TBD')} ${l.storeNumber?'- Store #'+esc(l.storeNumber):''}</p><dl><div><dt>Quote</dt><dd>${l.quoteAmount?money(l.quoteAmount):'Not sent'}</dd></div><div><dt>Sent</dt><dd>${l.quoteSentDate||'Open'}</dd></div></dl><label>Move<select data-move=${l.id}>${stages.map(s=>`<option value=${s.id} ${s.id===l.stageId?'selected':''}>${s.short}</option>`).join('')}</select></label><div><button class=text data-edit=${l.id}>Edit</button> <button class="text danger" data-delete=${l.id}>Delete</button></div></article>`}
function renderBoard(rows){document.querySelector('#board').innerHTML=`<div class=board>${stages.map(s=>{let rs=rows.filter(l=>l.stageId===s.id);return `<section class=col><div class=col-head><h3>${s.name}</h3><p>${rs.length} leads - ${money(rs.reduce((a,l)=>a+Number(l.quoteAmount||0),0))}</p></div><div class=cards>${rs.length?rs.map(card).join(''):'<p class=empty>No leads in this stage.</p>'}</div></section>`}).join('')}</div>`}
function renderList(rows){document.querySelector('#list').innerHTML=`<div class=toolbar><p>${rows.length} leads in view</p><button class="btn secondary" id=export-leads>Export Leads CSV</button></div><div class=table-wrap><table><thead><tr><th>Lead</th><th>Customer</th><th>Rep</th><th>Stage</th><th>Received</th><th>Quote Sent</th><th>Quote</th><th>Outcome</th><th></th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.externalLeadId)}</td><td>${esc(l.customerName)}</td><td>${esc(l.repName)}</td><td>${stageById[l.stageId].short}</td><td>${l.dateReceived||''}</td><td>${l.quoteSentDate||''}</td><td>${l.quoteAmount?money(l.quoteAmount):''}</td><td>${esc(l.lostReason||l.soldDate?'Won':'')}</td><td><button class=text data-edit=${l.id}>Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function renderReport(rows){let rs=roll(rows);document.querySelector('#report').innerHTML=`<div class=toolbar><div><p class=eyebrow>Leadership export</p><h3>CIS Lead-to-Revenue Summary</h3></div><button class="btn secondary" onclick="window.print()">Print</button></div><div class=table-wrap><table><thead><tr><th>Rep</th><th>Leads</th><th>Ran</th><th>Quotes</th><th>Quoted $</th><th>Open Potential</th><th>Won Jobs</th><th>Lost Jobs</th><th>Win Rate</th><th>Won $</th><th>Realized $</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.rep)}</td><td>${num(r.leads)}</td><td>${num(r.run)}</td><td>${num(r.quotes)}</td><td>${money(r.quoted)}</td><td>${money(r.potential)}</td><td>${num(r.wonJobs)}</td><td>${num(r.lostJobs)}</td><td>${pct(r.winRate)}</td><td>${money(r.won)}</td><td>${money(r.realized)}</td></tr>`).join('')}</tbody></table></div>`}
function fillForm(l={}){let f=document.querySelector('#form');f.reset();for(const [k,v] of Object.entries(l))if(f.elements[k])f.elements[k].value=v;f.elements.dateReceived.value=l.dateReceived||today();f.elements.stageId.value=l.stageId||'intake_measure_prep'}function csv(rows,cols){return [cols.map(c=>c[0]).join(','),...rows.map(r=>cols.map(c=>`"${String(c[1](r)??'').replace(/"/g,'""')}"`).join(','))].join('\n')}function download(name,text){let a=document.createElement('a'),b=new Blob([text],{type:'text/csv'});a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#stage-input').innerHTML=stages.map(s=>`<option value=${s.id}>${s.name}</option>`).join('');fillForm();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});['q','rep-filter','stage-filter','start'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)render()}));document.querySelector('#clear').onclick=()=>fillForm();document.querySelector('#reset').onclick=()=>{leads=sample;save();fillForm();render()};document.querySelector('#form').onsubmit=e=>{e.preventDefault();let f=e.target,l=Object.fromEntries(new FormData(f));l.id=l.id||crypto.randomUUID();l.quoteAmount=Number(l.quoteAmount||0);l.realizedRevenue=Number(l.realizedRevenue||0);if(stageById[l.stageId].sort>=30&&l.stageId!=='lost_cancelled'&&(!l.quoteAmount||!l.quoteSentDate))return alert('Quote amount and quote sent date are required once a lead reaches Quote or later.');if(l.stageId==='lost_cancelled'&&!l.lostReason)return alert('Choose a lost reason before closing the lead.');let i=leads.findIndex(x=>x.id===l.id);i>=0?leads[i]=l:leads.unshift(l);save();fillForm();render()};document.body.onclick=e=>{let id=e.target.dataset.edit;if(id)fillForm(leads.find(l=>l.id===id));id=e.target.dataset.delete;if(id&&confirm('Delete this lead?')){leads=leads.filter(l=>l.id!==id);save();render()}if(e.target.id==='export-leads')download('cis-leads-'+today()+'.csv',csv(filtered(),[['Lead ID',l=>l.externalLeadId],['Customer',l=>l.customerName],['Rep',l=>l.repName],['Stage',l=>stageById[l.stageId].name],['Quote',l=>l.quoteAmount],['Quote Sent',l=>l.quoteSentDate],['Lost Reason',l=>l.lostReason],['Notes',l=>l.notes]]))};document.body.onchange=e=>{let id=e.target.dataset.move;if(id){let l=leads.find(x=>x.id===id);l.stageId=e.target.value;if(l.stageId==='sold_payment_gate'&&!l.soldDate)l.soldDate=today();if(l.stageId==='lost_cancelled'&&!l.lostReason)l.lostReason='No Longer Interested';save();render()}};document.querySelector('#export-report').onclick=()=>download('cis-lead-report-'+today()+'.csv',csv(roll(filtered()),[['Rep',r=>r.rep],['Leads Assigned',r=>r.leads],['Leads Run',r=>r.run],['Quotes Sent',r=>r.quotes],['Total Quoted Revenue',r=>r.quoted],['Open Potential Revenue',r=>r.potential],['Won Jobs',r=>r.wonJobs],['Lost Jobs',r=>r.lostJobs],['Win Rate',r=>pct(r.winRate)],['Won Revenue',r=>r.won],['Realized Revenue',r=>r.realized]]));render();
</script>
</body>
</html>
